<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="container">
        <div class="card">
            <div class="card-header">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">LIVE</span>
                </div>
                <h1 class="title">Command Center v1</h1>
                <p class="subtitle">Deployed live via Git and VS Code.</p>
            </div>

            <div class="time-display-wrapper">
                <span class="time-label">Current Time</span>
                <p id="clock" class="clock">Loading live time...</p>
            </div>

            <div class="card-actions">
                <button id="refresh-btn" class="btn" onclick="updateTime()">Refresh Time</button>
            </div>
        </div>
    </main>
</body>
</html>
